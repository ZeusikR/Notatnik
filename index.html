<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tasks</title>

  <!-- PWA Konfiguracja do pełnego ekranu -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg: #1A1A1A;
      --card-bg: #121212;
      --input-bg: #1a1a1a;
      --border: #2a2a2a;
      --accent: #ff9800;
      --text: #ffffff;
      --text-muted: #666666;
      --danger: #e53935;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .categories-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border-color: var(--accent);
    }

    .add-cat-btn {
      background: none;
      border: 1px dashed var(--accent);
      color: var(--accent);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      text-align: center;
      cursor: pointer;
      grid-column: span 2;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
    }

    h1 {
      font-size: 1.3rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .action-btn:active {
      color: var(--danger);
      border-color: var(--danger);
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .add-item-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .shopping-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .item-text {
      flex: 1;
      font-size: 1rem;
      word-break: break-word;
      cursor: pointer;
    }

    .item.completed {
      opacity: 2.4;
      border-color: transparent;
    }

    .item.completed .item-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .delete-btn:active {
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      margin-top: 30px;
      font-size: 0.9rem;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-content h3 {
      color: var(--accent);
      font-size: 1.1rem;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-btn.cancel {
      background: var(--border);
      color: var(--text);
    }

    .modal-btn.confirm {
      background: var(--accent);
      color: #000;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="categories-grid" id="categoriesGrid"></div>

    <header>
      <h1 id="currentListTitle">Lista</h1>
      <div class="header-actions">
        <button class="action-btn" onclick="clearCompleted()">Usuń skreślone</button>
        <button class="action-btn" onclick="deleteCurrentList()" style="color: var(--danger); border-color: #333;">Usuń listę</button>
      </div>
    </header>

    <form class="input-group" onsubmit="addItem(event)">
      <input type="text" id="itemInput" placeholder="Dodaj wpis..." autocomplete="off">
      <button type="submit" class="add-item-btn">+</button>
    </form>

    <ul class="shopping-list" id="shoppingList"></ul>
    
    <div class="empty-state" id="emptyState" style="display: none;">
      Lista jest pusta.
    </div>
  </div>

  <div class="modal" id="listModal">
    <div class="modal-content">
      <h3>Nowa lista</h3>
      <input type="text" id="newListInput" placeholder="Nazwa listy..." autocomplete="off">
      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="closeModal()">Anuluj</button>
        <button class="modal-btn confirm" onclick="confirmAddList()">Utwórz</button>
      </div>
    </div>
  </div>

  <script>
    const defaultData = [
      {
        id: 1,
        name: "Zakupy",
        items: [
          { id: 101, text: "Chleb", completed: false },
          { id: 102, text: "Mleko", completed: true }
        ]
      },
      {
        id: 2,
        name: "Do zrobienia",
        items: [
          { id: 201, text: "Zrobić przegląd autka", completed: false }
        ]
      }
    ];

    let lists = JSON.parse(localStorage.getItem('czarne_listy_data')) || defaultData;
    let activeListId = JSON.parse(localStorage.getItem('czarna_aktywna_lista')) || lists[0]?.id || null;

    function saveData() {
      localStorage.setItem('czarne_listy_data', JSON.stringify(lists));
      localStorage.setItem('czarna_aktywna_lista', JSON.stringify(activeListId));
      render();
    }

    function openModal() {
      document.getElementById('listModal').style.display = 'flex';
      const input = document.getElementById('newListInput');
      input.value = '';
      input.focus();
    }

    function closeModal() {
      document.getElementById('listModal').style.display = 'none';
    }

    function confirmAddList() {
      const input = document.getElementById('newListInput');
      const name = input.value.trim();

      if (name !== "") {
        const newList = {
          id: Date.now(),
          name: name,
          items: []
        };
        lists.push(newList);
        activeListId = newList.id;
        closeModal();
        saveData();
      }
    }

    function deleteCurrentList() {
      if (lists.length <= 1) {
        const currentList = lists.find(l => l.id === activeListId);
        if (currentList && confirm(`To Twoja ostatnia lista. Czy chcesz wyczyścić wpisy z listy "${currentList.name}"?`)) {
          currentList.items = [];
          saveData();
        }
        return;
      }

      const currentList = lists.find(l => l.id === activeListId);
      if (confirm(`Czy na pewno chcesz usunąć całą listę "${currentList.name}"?`)) {
        lists = lists.filter(l => l.id !== activeListId);
        activeListId = lists[0].id;
        saveData();
      }
    }

    function switchList(id) {
      activeListId = id;
      saveData();
    }

    function addItem(event) {
      event.preventDefault();
      const input = document.getElementById('itemInput');
      const text = input.value.trim();

      if (text !== '') {
        const currentList = lists.find(l => l.id === activeListId);
        if (currentList) {
          currentList.items.unshift({ id: Date.now(), text: text, completed: false });
          input.value = '';
          saveData();
        }
      }
    }

    function toggleItem(itemId) {
      const currentList = lists.find(l => l.id === activeListId);
      if (currentList) {
        currentList.items = currentList.items.map(item => {
          if (item.id === itemId) {
            return { ...item, completed: !item.completed };
          }
          return item;
        });
        currentList.items.sort((a, b) => a.completed - b.completed);
        saveData();
      }
    }

    function deleteItem(itemId, event) {
      event.stopPropagation();
      const currentList = lists.find(l => l.id === activeListId);
      if (currentList) {
        currentList.items = currentList.items.filter(item => item.id !== itemId);
        saveData();
      }
    }

    function clearCompleted() {
      const currentList = lists.find(l => l.id === activeListId);
      if (currentList) {
        currentList.items = currentList.items.filter(item => !item.completed);
        saveData();
      }
    }

    function render() {
      const categoriesGrid = document.getElementById('categoriesGrid');
      categoriesGrid.innerHTML = '';

      lists.forEach(list => {
        const btn = document.createElement('button');
        btn.className = `cat-btn ${list.id === activeListId ? 'active' : ''}`;
        btn.innerText = list.name;
        btn.onclick = () => switchList(list.id);
        categoriesGrid.appendChild(btn);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'add-cat-btn';
      addBtn.innerText = '+ Nowa lista';
      addBtn.onclick = openModal;
      categoriesGrid.appendChild(addBtn);

      let currentList = lists.find(l => l.id === activeListId);
      if (!currentList && lists.length > 0) {
        activeListId = lists[0].id;
        currentList = lists[0];
      }
      if (!currentList) return;

      document.getElementById('currentListTitle').innerText = currentList.name;

      const listElement = document.getElementById('shoppingList');
      const emptyState = document.getElementById('emptyState');
      listElement.innerHTML = '';

      if (currentList.items.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      currentList.items.forEach(item => {
        const li = document.createElement('li');
        li.className = `item ${item.completed ? 'completed' : ''}`;
        li.onclick = () => toggleItem(item.id);

        li.innerHTML = `
          <span class="item-text">${item.text}</span>
          <button class="delete-btn" onclick="deleteItem(${item.id}, event)">✕</button>
        `;

        listElement.appendChild(li);
      });
    }

    render();
  </script>

</body>
</html>
